        // =========================================================
        // 2. REGLAS DE PUNTUACIÓN (Igual que tu PSeInt)
        // =========================================================
        function calcularPuntosVS(millones, esTop1) {
            let pts = 0;
            if (millones >= 30) pts = 20;
            else if (millones >= 15) pts = 15;
            else if (millones >= 7.2) pts = 10;
            else if (millones >= 3.6) pts = 5;
            if (esTop1 === true) pts += 1;
            return pts;
        }

        function calcularPuntosDonacion(miles) {
            if (miles >= 90) return 45;
            if (miles >= 70) return 35;
            if (miles >= 50) return 25;
            if (miles >= 30) return 15;
            return 0;
        }

        function calcularTotalJugador(j) {
            let total = 0;
            for (let i = 0; i < 4; i++) {
                if (j.marshall && j.marshall[i]) total += 20;
            }
            for (let i = 0; i < 6; i++) {
                const m = (j.vs && j.vs[i]) ? j.vs[i] : 0;
                const t = (j.top1 && j.top1[i]) ? j.top1[i] : false;
                total += calcularPuntosVS(m, t);
            }
            total += calcularPuntosDonacion(j.donacion || 0);
            if (j.tormenta) total += 45;
            return total;
        }

        // =========================================================
        // 3. SINCRONIZACIÓN EN VIVO CON FIREBASE
        // =========================================================
        dbRef.on("value", (snapshot) => {
            const datos = snapshot.val();
            document.getElementById("texto-estado").textContent = "🟢 Conectado en vivo";

            if (datos) {
                jugadores = Array.isArray(datos) ? datos : Object.values(datos);
                dibujarTabla();
            } else {
                // Primera vez: subimos los 96 jugadores a Firebase
                jugadores = listaInicial.map((item, idx) => ({
                    id: idx + 1,
                    nombre: item.nombre,
                    base: item.base,
                    marshall: [false, false, false, false],
                    vs: [0, 0, 0, 0, 0, 0],
                    top1: [false, false, false, false, false, false],
                    donacion: 0,
                    tormenta: false
                }));
                guardarEnNube();
            }
        });

        function guardarEnNube() {
            if (!esAdmin) return;
            dbRef.set(jugadores);
        }

        // =========================================================
        // 4. MODO ADMINISTRADOR (R4) VS SOLO LECTURA
        // =========================================================
        function alternarAdmin() {
            if (esAdmin) {
                esAdmin = false;
                actualizarInterfazAdmin();
                return;
            }
            const clave = prompt("Ingresa la clave de Administrador (R4):");
            if (clave === CLAVE_ADMIN) {
                esAdmin = true;
                actualizarInterfazAdmin();
            } else if (clave !== null) {
                alert("❌ Clave incorrecta.");
            }
        }

        function actualizarInterfazAdmin() {
            const badge = document.getElementById("badge-modo");
            const btnAdmin = document.getElementById("btn-modo-admin");
            const elementosAdmin = document.querySelectorAll(".solo-admin");

            if (esAdmin) {
                badge.textContent = "🔓 Modo Admin (Editando)";
                badge.className = "badge-modo modo-admin";
                btnAdmin.textContent = "🔒 Salir de Admin";
                elementosAdmin.forEach(el => el.style.display = el.tagName === "TH" ? "table-cell" : "inline-block");
            } else {
                badge.textContent = "👀 Solo Lectura";
                badge.className = "badge-modo modo-lectura";
                btnAdmin.textContent = "🔒 Modo Admin (R4)";
                elementosAdmin.forEach(el => el.style.display = "none");
            }
            dibujarTabla();
        }

        // =========================================================
        // 5. DIBUJAR TABLA
        // =========================================================
        function dibujarTabla() {
            const tbody = document.getElementById("cuerpo-tabla");
            const busqueda = document.getElementById("buscador").value.toLowerCase();
            const deshabilitado = esAdmin ? "" : "disabled";
            tbody.innerHTML = "";

            let contador = 1;

            for (let i = 0; i < jugadores.length; i++) {
                const j = jugadores[i];
                if (!j.nombre.toLowerCase().includes(busqueda)) continue;

                const total = calcularTotalJugador(j);
                const fila = document.createElement("tr");

                let htmlMarshall = "";
                for (let m = 0; m < 4; m++) {
                    const checked = (j.marshall && j.marshall[m]) ? "checked" : "";
                    htmlMarshall += `<td><input type="checkbox" class="check-grande" ${checked} ${deshabilitado} onchange="cambiarMarshall(${i}, ${m}, this.checked)"></td>`;
                }

                let htmlVS = "";
                for (let d = 0; d < 6; d++) {
                    const valVS = (j.vs && j.vs[d]) ? j.vs[d] : 0;
                    const claseEstrella = (j.top1 && j.top1[d]) ? "btn-top1 activo" : "btn-top1";
                    htmlVS += `
                        <td>
                            <div class="celda-vs">
                                <input type="number" step="0.1" min="0" class="input-num" value="${valVS}" ${deshabilitado} onchange="cambiarVS(${i}, ${d}, this.value)">
                                <button class="${claseEstrella}" ${deshabilitado} onclick="alternarTop1(${i}, ${d})">★</button>
                            </div>
                        </td>`;
                }

                const tormentaChecked = j.tormenta ? "checked" : "";
                const celdaBorrar = esAdmin ? `<td><button class="btn-borrar" onclick="eliminarJugador(${i})">✖</button></td>` : "";

                fila.innerHTML = `
                    <td>${contador}</td>
                    <td class="col-nombre">${j.nombre}</td>
                    <td><input type="number" class="input-base" value="${j.base}" ${deshabilitado} onchange="cambiarBase(${i}, this.value)"></td>
                    ${htmlMarshall}
                    ${htmlVS}
                    <td><input type="number" min="0" class="input-num" value="${j.donacion || 0}" ${deshabilitado} onchange="cambiarDonacion(${i}, this.value)"></td>
                    <td><input type="checkbox" class="check-grande" ${tormentaChecked} ${deshabilitado} onchange="cambiarTormenta(${i}, this.checked)"></td>
                    <td class="total-pts">${total}</td>
                    ${celdaBorrar}
                `;
                tbody.appendChild(fila);
                contador++;
            }
        }

        // =========================================================
        // 6. EDICIÓN DE DATOS (Solo si esAdmin = true)
        // =========================================================
        function cambiarBase(i, val) { jugadores[i].base = Number(val) || 0; guardarEnNube(); }
        function cambiarMarshall(i, m, checked) { jugadores[i].marshall[m] = checked; guardarEnNube(); }
        function cambiarVS(i, d, val) { jugadores[i].vs[d] = parseFloat(val) || 0; guardarEnNube(); }
        function alternarTop1(i, d) { jugadores[i].top1[d] = !jugadores[i].top1[d]; guardarEnNube(); }
        function cambiarDonacion(i, val) { jugadores[i].donacion = parseFloat(val) || 0; guardarEnNube(); }
        function cambiarTormenta(i, checked) { jugadores[i].tormenta = checked; guardarEnNube(); }

        function ordenarVista() {
            jugadores.sort((a, b) => calcularTotalJugador(b) - calcularTotalJugador(a));
            if (esAdmin) guardarEnNube();
            else dibujarTabla();
        }

        function agregarJugador() {
            if (!esAdmin) return;
            const nombre = prompt("Nombre del nuevo jugador:");
            if (!nombre || !nombre.trim()) return;
            const base = parseInt(prompt("Nivel de base:")) || 25;
            jugadores.push({
                id: Date.now(), nombre: nombre.trim(), base: base,
                marshall: [false, false, false, false],
                vs: [0, 0, 0, 0, 0, 0],
                top1: [false, false, false, false, false, false],
                donacion: 0, tormenta: false
            });
            guardarEnNube();
        }

        function eliminarJugador(i) {
            if (!esAdmin) return;
            if (confirm("¿Eliminar a " + jugadores[i].nombre + "?")) {
                jugadores.splice(i, 1);
                guardarEnNube();
            }
        }

        function nuevaSemana() {
            if (!esAdmin) return;
            if (!confirm("¿Reiniciar TODOS los puntajes a 0 en la nube para nueva semana?")) return;
            jugadores.forEach(j => {
                j.marshall = [false, false, false, false];
                j.vs = [0, 0, 0, 0, 0, 0];
                j.top1 = [false, false, false, false, false, false];
                j.donacion = 0;
                j.tormenta = false;
            });
            guardarEnNube();
        }

        // =========================================================
        // 7. ENVIAR TABLA DE POSICIONES (WhatsApp, Copiar y Excel)
        // =========================================================
        function generarTextoRanking() {
            // Creamos una copia ordenada de mayor a menor sin alterar la tabla original
            const ranking = [...jugadores].sort((a, b) => calcularTotalJugador(b) - calcularTotalJugador(a));
            const fecha = new Date().toLocaleDateString('es-CO');

            let texto = `🏆 *TABLA DE POSICIONES - ALIANZA IMPP* 🏆\n`;
            texto += `📅 Corte: ${fecha}\n`;
            texto += `━━━━━━━━━━━━━━━━━━━━\n`;

            ranking.forEach((j, idx) => {
                const pos = idx + 1;
                const pts = calcularTotalJugador(j);
                let medalla = `${pos}.`;
                if (pos === 1) medalla = "🥇";
                else if (pos === 2) medalla = "🥈";
                else if (pos === 3) medalla = "🥉";

                texto += `${medalla} *${j.nombre}* — ${pts} pts\n`;
            });

            texto += `━━━━━━━━━━━━━━━━━━━━\n`;
            texto += `🔥 ¡Gran trabajo equipo!`;
            return texto;
        }

        function copiarRanking() {
            const texto = generarTextoRanking();
            navigator.clipboard.writeText(texto).then(() => {
                alert("✅ ¡Tabla de posiciones copiada! Ahora solo pégala en el grupo de WhatsApp o Discord.");
            });
        }

        function enviarWhatsApp() {
            const texto = generarTextoRanking();
            const url = "https://wa.me/?text=" + encodeURIComponent(texto);
            window.open(url, "_blank");
        }

        function exportarExcel() {
            let csv = "Posición;Jugador;Nivel de Base;Marshall 1;Marshall 2;Marshall 3;Marshall 4;VS Día 1;VS Día 2;VS Día 3;VS Día 4;VS Día 5;VS Día 6;Donaciones;Tormenta;Puntos Totales\n";
            const ranking = [...jugadores].sort((a, b) => calcularTotalJugador(b) - calcularTotalJugador(a));

            ranking.forEach((j, idx) => {
                const m = j.marshall.map(x => x ? 20 : 0);
                const v = j.vs.map((val, d) => calcularPuntosVS(val, j.top1[d]));
                const don = calcularPuntosDonacion(j.donacion);
                const tor = j.tormenta ? 45 : 0;
                const tot = calcularTotalJugador(j);
                csv += `${idx + 1};${j.nombre};${j.base};${m[0]};${m[1]};${m[2]};${m[3]};${v[0]};${v[1]};${v[2]};${v[3]};${v[4]};${v[5]};${don};${tor};${tot}\n`;
            });

            const archivo = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
            const enlace = document.createElement("a");
            enlace.href = URL.createObjectURL(archivo);
            enlace.download = "Ranking_Alianza_IMPP.csv";
            enlace.click();
        }
    </script>
</body>
